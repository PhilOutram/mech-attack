<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a0b08" />
  <meta name="description" content="Mech Attack - unit reference for the hex strategy board game" />
  <title>Mech Attack</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" />
  <link rel="stylesheet" href="styles.css?v=0.01" />
</head>
<body>
  <section id="splash" class="splash" aria-label="Mech Attack">
    <img class="splash-art" src="splash.jpg"
      alt="Mech Attack - a blue battle tank firing across a red Martian desert" />
    <button id="start" class="start-btn" type="button">Tap to start</button>
  </section>

  <main id="units" class="units" hidden>
    <header class="units-head">
      <button id="home" class="home-btn" type="button" aria-label="Back to title screen">
        <img src="icon.png" alt="" />
      </button>
      <h1>Units</h1>
    </header>
    <div id="unit-list"></div>
    <section class="notes">
      <h2>Notes</h2>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <script src="app.js?v=0.01" type="module"></script>
</body>
</html>
