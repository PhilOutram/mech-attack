<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a0b08" />
  <meta name="description" content="Mech Attack - play the hex strategy board game against the AI" />
  <title>Mech Attack</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" />
  <link rel="stylesheet" href="styles.css?v=0.47" />
</head>
<body>
  <section id="splash" class="splash" aria-label="Mech Attack">
    <img class="splash-art" src="splash.jpg"
      alt="Mech Attack - a blue battle tank firing across a red Martian desert" />
    <nav class="splash-menu" aria-label="Main menu">
      <button id="menu-campaign" class="start-btn" type="button">Campaign</button>
      <button id="menu-play" class="start-btn" type="button">Play</button>
      <button id="menu-multi" class="start-btn" type="button">Multiplayer</button>
      <button id="menu-join" class="start-btn" type="button">Join game</button>
      <button id="menu-resume" class="start-btn" type="button" hidden>Resume</button>
      <button id="menu-units" class="start-btn" type="button">Units</button>
      <button id="menu-help" class="start-btn" type="button">Help</button>
    </nav>
  </section>

  <div id="campaign-picker" class="map-picker" hidden>
    <div class="map-picker-card" role="dialog" aria-labelledby="campaign-title">
      <h2 id="campaign-title">Campaign: Red Dust</h2>
      <p id="campaign-intro" class="campaign-intro"></p>
      <ul id="campaign-list" class="map-recent"></ul>
      <button id="campaign-cancel" class="start-btn" type="button">Back</button>
    </div>
  </div>

  <div id="mp-setup" class="map-picker" hidden>
    <div class="map-picker-card" role="dialog" aria-labelledby="mp-title">
      <h2 id="mp-title">Multiplayer</h2>
      <div class="map-choices mp-modes">
        <button class="start-btn" type="button" data-mp-mode="turns">Take turns</button>
        <button class="start-btn" type="button" data-mp-mode="coop">Same time (co-op)</button>
      </div>
      <p id="mp-explain" class="level-persona"></p>
      <ul id="mp-sides" class="mp-sides"></ul>
      <div class="map-choices">
        <button id="mp-fewer" class="start-btn" type="button">Remove</button>
        <button id="mp-more" class="start-btn" type="button">Add a side</button>
      </div>
      <label class="map-shape">Map shape
        <select id="mp-shape"></select>
      </label>
      <p id="mp-problem" class="mp-problem"></p>
      <div class="map-choices">
        <button id="mp-cancel" class="start-btn" type="button">Back</button>
        <button id="mp-start" class="start-btn confirm-yes" type="button">Start</button>
      </div>
    </div>
  </div>

  <div id="mp-lobby" class="map-picker" hidden>
    <div class="map-picker-card" role="dialog" aria-labelledby="mp-lobby-title">
      <h2 id="mp-lobby-title">Waiting for players</h2>
      <p class="mp-code" id="mp-lobby-code"></p>
      <p id="mp-lobby-status" class="level-persona"></p>
      <ul id="mp-lobby-players" class="mp-sides"></ul>
      <div class="map-choices">
        <button id="mp-lobby-cancel" class="start-btn" type="button">Cancel</button>
        <button id="mp-lobby-start" class="start-btn confirm-yes" type="button">Start</button>
      </div>
    </div>
  </div>

  <div id="mp-join" class="map-picker" hidden>
    <div class="map-picker-card" role="dialog" aria-labelledby="mp-join-title">
      <h2 id="mp-join-title">Join a game</h2>
      <form id="mp-join-form" class="map-number">
        <label for="mp-code">Code</label>
        <input id="mp-code" type="text" maxlength="4" autocomplete="off"
          autocapitalize="characters" spellcheck="false" />
        <button class="start-btn" type="submit">Join</button>
      </form>
      <p id="mp-join-status" class="level-persona"></p>
      <button id="mp-join-cancel" class="start-btn" type="button">Back</button>
    </div>
  </div>

  <div id="map-picker" class="map-picker" hidden>
    <div class="map-picker-card" role="dialog" aria-labelledby="map-picker-title">
      <h2 id="map-picker-title">Choose a map</h2>
      <label class="map-shape level-pick">Your rank
        <select id="level"></select>
      </label>
      <p id="level-persona" class="level-persona"></p>
      <div class="map-options">
        <label class="map-shape">Size
          <select id="map-size"></select>
        </label>
        <label class="map-shape">Shape
          <select id="map-shape"></select>
        </label>
      </div>
      <div class="map-choices">
        <button id="map-new" class="start-btn" type="button">New map</button>
        <button id="map-fixed" class="start-btn" type="button">Fixed map 1</button>
      </div>
      <form id="map-number-form" class="map-number">
        <label for="map-number">Map number</label>
        <input id="map-number" type="number" min="1" step="1" inputmode="numeric" required />
        <button class="start-btn" type="submit">Play</button>
      </form>
      <h3>Recent maps</h3>
      <ul id="map-recent" class="map-recent"></ul>
      <button id="map-cancel" class="start-btn" type="button">Back</button>
    </div>
  </div>

  <main id="units" class="units" hidden>
    <header class="units-head">
      <button id="home" class="home-btn" type="button" aria-label="Back to main menu">
        <img src="icon.png" alt="" />
      </button>
      <h1>Units</h1>
    </header>
    <div id="unit-list"></div>
    <section class="notes">
      <h2>Notes</h2>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <main id="game" class="game" hidden>
    <header class="game-bar">
      <button id="game-home" class="home-btn" type="button" aria-label="Back to main menu">
        <img src="icon.png" alt="" />
      </button>
      <div class="game-status">
        <span id="game-round"></span>
        <span id="game-turn"></span>
      </div>
      <div class="game-crystals" title="Your crystals">
        <img src="units/crystals.svg" alt="Crystals" /><span id="game-crystals"></span>
      </div>
      <button id="sound-toggle" class="sound-toggle" type="button" aria-label="Sound"></button>
      <button id="objective-btn" class="end-turn objective-btn" type="button"
        hidden>Objective</button>
      <button id="quit-game" class="end-turn quit-game" type="button">Quit</button>
      <button id="end-turn" class="end-turn" type="button">End turn</button>
    </header>
    <div class="board-wrap">
      <svg id="board" class="board" xmlns="http://www.w3.org/2000/svg"
        aria-label="Game board"><g id="board-root"></g></svg>
      <div id="game-banner" class="game-banner" role="status" hidden></div>
      <div id="build-info" class="build-info" hidden></div>
    </div>
    <section class="panel" aria-live="polite">
      <p id="game-message" class="game-message"></p>
      <div id="unit-panel"></div>
    </section>
    <div id="pass-device" class="pass-device" hidden>
      <div class="game-over-card">
        <h2 id="pass-title"></h2>
        <p id="pass-text"></p>
        <button id="pass-go" class="start-btn confirm-yes" type="button"></button>
      </div>
    </div>
    <div id="game-over" class="game-over" hidden>
      <div class="game-over-card">
        <h2 id="game-over-title"></h2>
        <p id="game-over-text"></p>
        <div id="game-over-unlocks" hidden></div>
        <button id="play-again" class="start-btn" type="button">Replay this map</button>
        <button id="play-new-map" class="start-btn" type="button">New game</button>
        <button id="game-over-home" class="start-btn" type="button">Main menu</button>
      </div>
    </div>
  </main>

  <div id="confirm-dialog" class="map-picker" hidden>
    <div class="map-picker-card" role="alertdialog" aria-labelledby="confirm-title"
      aria-describedby="confirm-text">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text" class="confirm-text"></p>
      <div id="confirm-extra" hidden></div>
      <div class="map-choices">
        <button id="confirm-no" class="start-btn" type="button"></button>
        <button id="confirm-yes" class="start-btn confirm-yes" type="button"></button>
      </div>
    </div>
  </div>

  <div id="tip-dialog" class="map-picker tip-dialog" hidden>
    <div class="map-picker-card" role="dialog" aria-labelledby="tip-title"
      aria-describedby="tip-text">
      <h2 id="tip-title"></h2>
      <p id="tip-text" class="confirm-text"></p>
      <div class="map-choices">
        <button id="tip-hide" class="start-btn" type="button">Hide tips</button>
        <button id="tip-ok" class="start-btn confirm-yes" type="button">Got it</button>
      </div>
    </div>
  </div>

  <script src="app.js?v=0.47" type="module"></script>
</body>
</html>
